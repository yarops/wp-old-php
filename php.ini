display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/apache2/php_errors.log

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; старый WP иногда ломается на новых дефолтах mysqlnd/short_open_tag — ниже safe-defaults
short_open_tag = Off
